      const contenedor = document.getElementById("contenedor-fichas");

          .from('ganado')
          .select('*')

        animalesVentaMemoria = VIENTRES_OFICIALES;
        renderizarFichas(animalesVentaMemoria);
      }

        } else {
          tabla.classList.add("hidden");
          if (btn) btn.innerText = "📊 Ver DEPs Genómicos ERA";
        }
      }
    }

                  <span class="font-extrabold text-green-400 text-xs">Puro de Pedigree</span>
                </div>
              </div>

              <div class="bg-gray-950/60 p-3 rounded-xl border border-gray-800/60 text-xs space-y-1">
                <p><span class="text-gray-400 font-bold">Padre:</span> ${animal.padre || 'No informado'}</p>
                <p><span class="text-gray-400 font-bold">Madre:</span> ${animal.madre || 'No informada'}</p>
                <p><span class="text-gray-500 text-[10px]">A. Paterno: ${animal.abuelo_p || '-'} | A. Materno: ${animal.abuelo_m || '-'}</span></p>
              </div>

              ${tablaDepsHTML}

              <a href="https://wa.me/5492262317696?text=Hola,%20me%20interesa%20consultar%20por%20la%20hembra%20RP%20${rp}%20(${encodeURIComponent(nombre)})" target="_blank" class="block w-full bg-green-700 hover:bg-green-600 text-white text-center font-bold text-xs py-3 rounded-xl shadow-lg transition-all">
                📲 Consultar por RP ${rp} vía WhatsApp
              </a>
            </div>
          </article>
        `;
      }).join("");
    }

    function filtrarCategoria(cat) {
      filtroCatActual = cat;
      ['todos', 'toro', 'vientre'].forEach(c => {
        const btn = document.getElementById(`btn-cat-${c}`);
        if(btn) btn.className = c === cat ? "px-4 py-2 rounded-xl text-xs font-bold bg-green-700 text-white shadow" : "px-4 py-2 rounded-xl text-xs font-bold bg-gray-900 text-gray-300 border border-gray-800";
      });
      filtrarPorRP();
    }

    function filtrarPorRP() {
      const q = document.getElementById("buscar-rp").value.trim().toLowerCase();
      const filtrados = animalesVentaMemoria.filter(a => {
        const esToro = String(a.tipo || '').toLowerCase().includes('toro') || a.sexo === 'M';
        const coincideCat = filtroCatActual === 'todos' || (filtroCatActual === 'toro' && esToro) || (filtroCatActual === 'vientre' && !esToro);
        const rpMatch = String(a.rp || '').toLowerCase().includes(q) || String(a.nombre || '').toLowerCase().includes(q);
        return coincideCat && rpMatch;
      });
      renderizarFichas(filtrados);
    }
  </script>
