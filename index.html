<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cabaña Santa Cándida - Venta Particular Angus</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://sppbcmeccxqjdqecuhmz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_uDEHN1Nj27dYRAJaZp5eDw_Cw_M4ZOi';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen antialiased selection:bg-green-500">

  <header class="bg-gray-900/90 backdrop-blur border-b border-green-800/40 sticky top-0 z-50 px-4 py-3">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <img src="./logo.png" alt="Santa Cándida" class="w-9 h-9 rounded-full border border-green-600 bg-white object-cover" onerror="this.onerror=null; this.src='https://via.placeholder.com/40';">
        <div>
          <h1 class="font-extrabold text-sm sm:text-base text-white leading-tight">Cabaña Santa Cándida</h1>
          <p class="text-[11px] text-green-400 font-medium">Reproductores Angus - Venta Particular</p>
        </div>
      </div>
      <a href="https://wa.me/5492262317696?text=Hola,%20quisiera%20consultar%20por%20los%20reproductores%20en%20venta%20particular" target="_blank" class="bg-green-600 hover:bg-green-500 text-white font-bold text-xs px-3.5 py-2 rounded-xl transition-all shadow-lg flex items-center gap-1">
        💬 Consulta General
      </a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">
    <section class="text-center py-4 space-y-2">
      <span class="bg-green-950 text-green-400 border border-green-800/60 text-[10px] tracking-wider uppercase font-extrabold px-3 py-1 rounded-full">Catálogo Digital</span>
      <h2 class="text-2xl sm:text-3xl font-black text-white">Venta Particular de Hacienda</h2>
      <p class="text-xs sm:text-sm text-gray-400 max-w-md mx-auto">Selección de toros y vientres PP Aberdeen Angus evaluados con datos genómicos ERA.</p>
    </section>

    <div class="space-y-3">
      <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
        <button onclick="filtrarCategoria('todos')" id="btn-cat-todos" class="px-4 py-2 rounded-xl text-xs font-bold bg-green-700 text-white shadow">Todos</button>
        <button onclick="filtrarCategoria('toro')" id="btn-cat-toro" class="px-4 py-2 rounded-xl text-xs font-bold bg-gray-900 text-gray-300 border border-gray-800">Toros</button>
        <button onclick="filtrarCategoria('vientre')" id="btn-cat-vientre" class="px-4 py-2 rounded-xl text-xs font-bold bg-gray-900 text-gray-300 border border-gray-800">Hembras / Vientres</button>
      </div>
      <input type="text" id="buscar-rp" oninput="filtrarPorRP()" placeholder="🔍 Buscar por RP de animal..." class="w-full p-3 rounded-xl bg-gray-900 border border-gray-800 text-sm text-white placeholder-gray-500 outline-none focus:border-green-600">
    </div>

    <div id="contenedor-fichas" class="grid grid-cols-1 gap-6">
      <p class="text-xs text-gray-500 text-center py-8">Cargando fichas de animales en venta...</p>
    </div>
  </main>

  <!-- Modal Pantalla Completa para Fotos -->
  <div id="modal-imagen" onclick="cerrarImagenFull()" class="fixed inset-0 z-50 bg-black/95 hidden items-center justify-center p-4 cursor-zoom-out">
    <div class="relative max-w-4xl max-h-full flex items-center justify-center">
      <img id="img-full-src" src="" class="max-w-full max-h-[90vh] object-contain rounded-xl border border-gray-800">
      <button class="absolute top-2 right-2 bg-black/70 text-white px-3 py-1.5 rounded-full text-xs font-bold">✕ Cerrar</button>
    </div>
  </div>

  <script>
    let animalesVentaMemoria = [];
    let filtroCatActual = 'todos';

    const PEDIGREES_VENTA = {
      "778": "Gentil x Don Antonio x Trueno x Payador",
      "684": "Rumi x Trueno x Payador",
      "784": "Napolitano x Density x Zorzal x Credito",
      "772": "Ñato x Lider x Curu x Density",
      "718": "Napolitano x Elegido x Density",
      "792": "Rumi x Toluca x Lider",
      "768": "Gentil x Don Antonio x Prototipo"
    };

    document.addEventListener("DOMContentLoaded", () => {
      cargarAnimalesEnVenta();
    });

    async function cargarAnimalesEnVenta() {
      const contenedor = document.getElementById("contenedor-fichas");
      
      try {
        const { data, error } = await supabaseClient
          .from('ganado')
          .select('*')
          .eq('en_venta', true);

        if (error || !data || data.length === 0) {
          contenedor.innerHTML = `<p class="text-xs text-gray-400 text-center py-10">No hay animales disponibles cargados en Supabase.</p>`;
          return;
        }

        animalesVentaMemoria = data;
        renderizarFichas(animalesVentaMemoria);
      } catch (err) {
        console.error("Error cargando desde Supabase:", err);
      }
    }

    async function manejarSubidaArchivo(event, rp) {
      const files = event.target.files;
      if (!files || files.length === 0) return;

      const animalActual = animalesVentaMemoria.find(a => String(a.rp) === String(rp));
      if (!animalActual) return;

      let fotosActuales = animalActual.fotos_urls || [];
      let videosActuales = animalActual.videos_urls || [];

      // Mostrar alerta o indicador visual rápido si se desea
      alert("⬆️ Subiendo archivo a Supabase Storage...");

      for (let file of files) {
        const timestamp = Date.now();
        const fileName = `venta_${rp}_${timestamp}_${file.name.replace(/[^a-zA-Z0-9_.-]/g, '_')}`;

        try {
          const { error: uploadError } = await supabaseClient.storage
            .from('fotos-ganado')
            .upload(fileName, file);

          if (uploadError) {
            console.error("Error subiendo archivo:", uploadError);
            continue;
          }

          const { data: publicUrlData } = supabaseClient.storage
            .from('fotos-ganado')
            .getPublicUrl(fileName);

          if (publicUrlData && publicUrlData.publicUrl) {
            if (file.type.includes('video') || file.name.match(/\.(mp4|mov|avi|mkv|webm)$/i)) {
              videosActuales.push(publicUrlData.publicUrl);
            } else {
              fotosActuales.push(publicUrlData.publicUrl);
            }
          }
        } catch (err) {
          console.error("Excepción en subida:", err);
        }
      }

      const { error: updateError } = await supabaseClient
        .from('ganado')
        .update({ fotos_urls: fotosActuales, videos_urls: videosActuales })
        .eq('rp', rp);

      if (updateError) {
        alert("Hubo un error al actualizar la base de datos.");
        console.error(updateError);
      } else {
        animalActual.fotos_urls = fotosActuales;
        animalActual.videos_urls = videosActuales;
        renderizarFichas(animalesVentaMemoria);
        alert("¡Multimedia guardada y sincronizada correctamente!");
      }
    }

    function abrirImagenFull(url) {
      const modal = document.getElementById('modal-imagen');
      const img = document.getElementById('img-full-src');
      img.src = url;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function cerrarImagenFull() {
      document.getElementById('modal-imagen').classList.add('hidden');
      document.getElementById('modal-imagen').classList.remove('flex');
    }

    function renderizarFichas(lista) {
      const contenedor = document.getElementById("contenedor-fichas");
      if (!contenedor) return;

      if (lista.length === 0) {
        contenedor.innerHTML = `<p class="text-xs text-gray-400 text-center py-8">No se encontraron animales que coincidan con la búsqueda.</p>`;
        return;
      }

      contenedor.innerHTML = lista.map(animal => {
        const rp = animal.rp || '-';
        const nombre = animal.nombre || `RP ${rp}`;
        const esToro = String(animal.tipo || '').toLowerCase().includes('toro') || animal.sexo === 'M';
        const categoriaEtiqueta = animal.tipo || (esToro ? 'Toro Reproductor' : 'Vientre PP');

        const pedigreeTexto = PEDIGREES_VENTA[String(rp)] || animal.pedigree || '';

        let videos = animal.videos_urls || [];
        let fotos = animal.fotos_urls || [];
        if (fotos.length === 0 && animal.foto_url) fotos.push(animal.foto_url);

        let mediaItems = [];
        videos.forEach(v => { if (v) mediaItems.push({ type: 'video', url: v }); });
        fotos.forEach(f => { if (f) mediaItems.push({ type: 'image', url: f }); });

        if (mediaItems.length === 0) {
          mediaItems.push({ type: 'image', url: './logo.png' });
        }

        const galeriaHTML = `
          <div class="flex overflow-x-auto snap-x snap-mandatory no-scrollbar w-full h-72 bg-black">
            ${mediaItems.map(item => {
              if (item.type === 'video') {
                return `
                  <div class="snap-center shrink-0 w-full h-full flex items-center justify-center relative">
                    <video controls class="w-full h-full object-contain">
                      <source src="${item.url}" type="video/mp4">
                    </video>
                  </div>`;
              } else {
                return `
                  <div class="snap-center shrink-0 w-full h-full cursor-zoom-in flex items-center justify-center bg-black" onclick="abrirImagenFull('${item.url}')">
                    <img src="${item.url}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/600x340?text=Santa+C%C3%A1ndida'">
                  </div>`;
              }
            }).join('')}
          </div>
        `;

        let depsHTML = '<p class="text-[11px] text-gray-500 italic text-center py-2">Sin DEPs cargados</p>';
        if (animal.deps && typeof animal.deps === 'object') {
          const d = animal.deps;
          depsHTML = `
            <div class="overflow-x-auto">
              <table class="w-full text-center text-[10px] sm:text-xs border-collapse">
                <thead>
                  <tr class="bg-gray-950 text-green-400 border-b border-gray-800">
                    <th class="p-1.5 font-bold">Variable</th>
                    <th class="p-1.5 font-bold">DEP</th>
                    <th class="p-1.5 font-bold">Prec %</th>
                    <th class="p-1.5 font-bold">% DEP</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-800/60 text-gray-300">
                  ${Object.entries(d).map(([key, val]) => `
                    <tr>
                      <td class="p-1.5 font-bold uppercase text-left text-gray-400">${key}</td>
                      <td class="p-1.5 font-extrabold text-white">${val.dep || '-'}</td>
                      <td class="p-1.5 text-gray-400">${val.prec || '-'}</td>
                      <td class="p-1.5 text-green-400 font-semibold">${val.per || '-'}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `;
        }

        return `
          <article class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden shadow-2xl transition-all hover:border-green-700/50">
            <div class="relative bg-black">
              ${galeriaHTML}
              <span class="absolute top-3 left-3 bg-green-700 text-white font-black text-[10px] px-2.5 py-1 rounded-md shadow uppercase tracking-wider z-10">${categoriaEtiqueta}</span>
              ${mediaItems.length > 1 ? `<span class="absolute bottom-3 right-3 bg-black/80 text-white font-bold text-[10px] px-2 py-0.5 rounded-full z-10">Deslizar (${mediaItems.length}) 👉</span>` : ''}
            </div>

            <div class="p-5 space-y-4">
              <div class="flex justify-between items-start border-b border-gray-800 pb-3">
                <div>
                  <h3 class="text-base sm:text-lg font-black text-white">${nombre}</h3>
                  <p class="text-xs text-gray-400 mt-0.5">RP: <span class="font-bold text-white">${rp}</span> | HBA: <span class="font-bold text-white">${animal.hba || 'Pendiente'}</span></p>
                </div>
                <span class="bg-green-950 text-green-400 border border-green-800/50 text-xs px-2.5 py-1 rounded-lg font-bold">Disponible</span>
              </div>

              <div class="bg-gray-950/60 p-3 rounded-xl border border-gray-800/60 text-xs space-y-1">
                ${pedigreeTexto ? `<p class="pb-1.5 border-b border-gray-800"><span class="text-green-400 font-bold">Pedigree:</span> <span class="text-white">${pedigreeTexto}</span></p>` : ''}
                <p><span class="text-gray-400 font-bold">Padre:</span> ${animal.padre || 'No informado'}</p>
                <p><span class="text-gray-400 font-bold">Madre:</span> ${animal.madre || 'No informada'}</p>
              </div>

              <div class="bg-gray-950 p-3 rounded-xl border border-gray-800 space-y-2">
                <p class="text-[11px] font-black text-green-400 uppercase tracking-wider">📊 Datos Genómicos ERA (Angus GS)</p>
                ${depsHTML}
              </div>

              <div class="bg-gray-950 p-3 rounded-xl border border-dashed border-green-800/60 text-center space-y-2">
                <label class="block text-[11px] text-green-400 font-bold uppercase tracking-wider cursor-pointer hover:text-green-300">
                  ➕ Agregar Foto o Video para RP ${rp}
                  <input type="file" accept="image/*,video/*" multiple onchange="manejarSubidaArchivo(event, '${rp}')" class="hidden">
                </label>
              </div>

              <a href="https://wa.me/5492262317696?text=Hola,%20me%20interesa%20consultar%20por%20el%20animal%20RP%20${rp}%20(${encodeURIComponent(nombre)})" target="_blank" class="block w-full bg-green-700 hover:bg-green-600 text-white text-center font-bold text-xs py-3 rounded-xl shadow-lg transition-all">
                📲 Consultar por RP ${rp} vía WhatsApp
              </a>
            </div>
          </article>
        `;
      }).join("");
    }

    function filtrarCategoria(cat) {
      filtroCatActual = cat;
      ['todos', 'toro', 'vientre'].forEach(c => {
        const btn = document.getElementById(`btn-cat-${c}`);
        if(btn) btn.className = c === cat ? "px-4 py-2 rounded-xl text-xs font-bold bg-green-700 text-white shadow" : "px-4 py-2 rounded-xl text-xs font-bold bg-gray-900 text-gray-300 border border-gray-800";
      });
      filtrarPorRP();
    }

    function filtrarPorRP() {
      const q = document.getElementById("buscar-rp").value.trim().toLowerCase();
      const filtrados = animalesVentaMemoria.filter(a => {
        const esToro = String(a.tipo || '').toLowerCase().includes('toro') || a.sexo === 'M';
        const coincideCat = filtroCatActual === 'todos' || (filtroCatActual === 'toro' && esToro) || (filtroCatActual === 'vientre' && !esToro);
        const rpMatch = String(a.rp || '').toLowerCase().includes(q) || String(a.nombre || '').toLowerCase().includes(q);
        return coincideCat && rpMatch;
      });
      renderizarFichas(filtrados);
    }
  </script>
</body>
</html>
